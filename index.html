<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricotta 근무·급여</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ricotta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap">
<style>
/* Monochrome. One working column (max 960px). Store iPad gets a full-screen clock view. */
:root {
  --bg: #F7F7F5; --surface: #FFFFFF; --line: #E2E2DF; --ink: #111111; --muted: #6A6A66;
  --strong: #111111; --on-strong: #FFFFFF; --soft: #EFEFEC;
  --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --brand: 'Playfair Display', Georgia, serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0E; --surface: #171717; --line: #2E2E2E; --ink: #F2F2F0; --muted: #9C9C98;
  --strong: #F2F2F0; --on-strong: #111111; --soft: #242424; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #171717; --line: #2E2E2E; --ink: #F2F2F0; --muted: #9C9C98;
  --strong: #F2F2F0; --on-strong: #111111; --soft: #242424; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); min-height: 100vh; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) 0 env(safe-area-inset-left, 0); }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 120px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.cap { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
[hidden] { display: none !important; }

/* Header */
header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--brand); font-size: 22px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand span { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 99px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--strong); color: var(--on-strong); }
.lang button { padding: 5px 10px; font-size: 13px; }

nav.tabs { display: flex; gap: 2px; max-width: 960px; margin: 0 auto; padding: 0 12px; }
nav.tabs button { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
nav.tabs button svg { width: 18px; height: 18px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
@media (max-width: 720px) {
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; max-width: none; }
  nav.tabs button { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 12px; border-bottom: 0; border-radius: 10px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button[aria-selected="true"] { background: var(--soft); }
}

section.view { display: grid; gap: 16px; padding-top: 20px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.head h2 { font-size: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 16px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--strong); border-color: var(--strong); color: var(--on-strong); }
.btn.ghost { background: none; border-color: transparent; }
.btn.big { width: 100%; padding: 16px; font-size: 18px; border-radius: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.pill.alert { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.pill.on { border-color: var(--ink); color: var(--ink); }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 14px; background: var(--soft); border: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--soft); }
.who { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.who > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.day-h { padding: 9px 16px; background: var(--bg); border-top: 1px solid var(--line); font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.card > .day-h:first-child { border-top: 0; border-radius: var(--r) var(--r) 0 0; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--ink); }

.empty { display: grid; gap: 14px; padding: 28px 20px; text-align: center; justify-items: center; }
.empty h3 { font-size: 18px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .steps { grid-template-columns: 1fr; } }
.step { padding: 16px; display: grid; gap: 6px; }
.step.click { cursor: pointer; }
.step.click:hover { background: var(--soft); }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--strong); color: var(--on-strong); }
.step.done .n { background: none; color: var(--ink); border: 1px solid var(--ink); }

/* Payroll */
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .sum { grid-template-columns: 1fr 1fr; } .sum > :last-child { grid-column: 1 / -1; } }
.kpi { padding: 14px 16px; }
.kpi .v { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pay-card { padding: 14px 16px; display: grid; gap: 8px; border-top: 1px solid var(--line); cursor: pointer; }
.pay-card:first-child { border-top: 0; }
.pay-card:hover { background: var(--soft); }
.pay-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.pay-top .amt { font-family: var(--mono); font-size: 20px; font-weight: 700; text-align: right; }
.break { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.break b { color: var(--ink); font-weight: 600; font-family: var(--mono); }
.days { display: grid; gap: 2px; padding-top: 6px; border-top: 1px dashed var(--line); }
.days div { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; font-size: 13px; }
.tipbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }

/* Forms */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
label.f input, label.f select, label.f textarea, select.sel, input.sel, textarea.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 10px; color: var(--ink); min-width: 0; font-size: 16px; }
input[type="checkbox"] { accent-color: var(--strong); width: 18px; height: 18px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.set-group { display: grid; gap: 12px; }
.set-group h3 { font-size: 16px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ink); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--strong); color: var(--on-strong); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 80; max-width: calc(100% - 32px); }
textarea.out { width: 100%; min-height: 130px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--surface); color: var(--ink); }
.editbox { padding: 16px; display: grid; gap: 12px; background: var(--bg); border-top: 1px solid var(--line); }
.inline-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.log { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

/* Login */
.auth { max-width: 420px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 20px; }
.auth .brand { justify-content: center; margin: 0; }
.auth .brand b { font-size: 30px; }
.auth form { display: grid; gap: 12px; }

/* Store iPad (kiosk) */
.k-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.k-top .where { font-weight: 700; font-size: 18px; }
.k-clock { font-family: var(--mono); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; }
.k-main { max-width: 1100px; margin: 0 auto; padding: 20px 20px 40px; display: grid; gap: 18px; }
.k-names { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.k-name { display: grid; justify-items: center; gap: 8px; padding: 20px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; font-weight: 700; font-size: 18px; }
.k-name .av { width: 56px; height: 56px; font-size: 22px; }
.k-name .st { font-size: 13px; color: var(--muted); font-weight: 500; }
.k-name.in { border-color: var(--ink); }
.k-name.in .st { color: var(--ink); font-weight: 700; }
.k-name[aria-pressed="true"] { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.k-name[aria-pressed="true"] .st { color: var(--on-strong); }
.k-name[aria-pressed="true"] .av { background: var(--on-strong); color: var(--strong); border-color: var(--on-strong); }
.k-sheet { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .45); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.k-sheet .k-panel { width: min(100%, 460px); }
.k-panel { display: grid; gap: 14px; padding: 20px; justify-items: center; text-align: center; }
.k-panel h3 { font-size: 24px; }
.k-action { width: min(100%, 520px); padding: 24px; font-size: 26px; border-radius: 18px; }
.dots { display: flex; gap: 14px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); }
.dots i.on { background: var(--ink); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 84px); gap: 12px; }
.keypad button { height: 72px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 28px; font-weight: 600; }
.keypad button:active { background: var(--soft); }
.k-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.done { position: fixed; inset: 0; z-index: 90; background: var(--strong); color: var(--on-strong); display: grid; place-items: center; text-align: center; padding: 24px; }
.done .big { font-size: clamp(40px, 8vw, 72px); font-weight: 700; line-height: 1.15; }
.done .t { font-family: var(--mono); font-size: clamp(32px, 6vw, 56px); font-weight: 600; margin-top: 10px; }
.k-note { display: grid; gap: 16px; width: min(100%, 560px); }
.k-note textarea { width: 100%; min-height: 120px; border-radius: 14px; border: 0; padding: 14px; font: 18px/1.5 var(--sans); color: var(--ink); background: var(--surface); }
.done p { margin-top: 18px; font-size: 18px; opacity: .8; }
.dot-status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.dot-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.dot-status.off i { background: none; border: 1.5px solid var(--muted); }
@media (prefers-reduced-motion: reduce) { .dots.shake { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
