# Free Supabase projects pause after 7 idle days (e.g. café closed for holidays).
# One tiny read-only request per day keeps the database awake.
name: keep database awake
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST 'https://pyxunhxrkeefgaduhibv.supabase.co/rest/v1/rpc/has_owner' \
            -H 'apikey: sb_publishable_QGEIdtWUoj-QJo_sxEy7oQ_OgI1GuNn' \
            -H 'Content-Type: application/json' -d '{}'
  # GitHub turns off scheduled jobs in public repos after 60 days without commits.
  # An empty commit every 40 quiet days keeps the reminders running.
  stay-active:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((40 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled jobs active"
            git push
          fi
